<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Cloud Assistant — Malayalam & English Smart Chat</title>
  <meta name="description" content="Neon Cloud Assistant: Self-hosted Cloudflare Worker AI assistant with Malayalam and English support, math solver, and persistent MEMORY_KV knowledge." />
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
    .box { max-width: 720px; margin: 0 auto; background: #1e293b; border-radius: 12px; padding: 20px; }
    h1 { margin-top: 0; font-size: 1.4rem; }
    #log { min-height: 220px; max-height: 420px; overflow-y: auto; background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    .msg { margin: 8px 0; line-height: 1.5; white-space: pre-wrap; }
    .u { color: #38bdf8; }
    .a { color: #a7f3d0; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; }
    button { padding: 10px 16px; border-radius: 8px; border: none; background: #22c55e; color: #052e16; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Neon Cloud Assistant</h1>
    <p>ചോദ്യങ്ങൾ ചോദിക്കാം, കണക്ക് കൂട്ടാം, അല്ലെങ്കിൽ <code>പഠിക്കുക: ചോദ്യം | ഉത്തരം</code> വഴി പുതിയ കാര്യങ്ങൾ സേവ് ചെയ്യാം.</p>
    <div id="log"></div>
    <form id="f">
      <input id="inp" type="text" placeholder="ഇവിടെ ടൈപ്പ് ചെയ്യൂ... (ഉദാ: (25 * 4) + 10)" required />
      <button type="submit">അയയ്ക്കുക</button>
    </form>
  </div>
  <script>
    const API_URL = "https://nameless-cloud-5f51.archanaammu1556.workers.dev";
    const BOT_NAME = "Neon Cloud Assistant";
    const log = document.getElementById("log");
    const form = document.getElementById("f");
    const inp = document.getElementById("inp");

    function addMsg(cls, txt) {
      const d = document.createElement("div");
      d.className = "msg " + cls;
      d.textContent = txt;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }

    addMsg("a", BOT_NAME + ": നമസ്കാരം! ഞാൻ Neon Cloud Assistant ആണ്. എന്ത് ചോദിക്കാനാണ് ഉള്ളത്?");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = inp.value.trim();
      if (!q) return;
      addMsg("u", "നിങ്ങൾ: " + q);
      inp.value = "";
      addMsg("a", BOT_NAME + ": ആലോചിക്കുന്നു...");
      const loadingEl = log.lastChild;
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: q, mode: "chat" })
        });
        const data = await res.json();
        loadingEl.textContent = BOT_NAME + ": " + (data.reply || JSON.stringify(data));
      } catch (err) {
        loadingEl.textContent = BOT_NAME + " (പിശക്): " + err.message;
      }
    });
  </script>
</body>
</html>
